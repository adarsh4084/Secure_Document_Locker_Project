{% extends 'base.html' %}
{% block title %}{{ code }} | Vaultly{% endblock %}
{% block body_class %}app-body{% endblock %}
{% block content %}
<section class="error-page section-wrap">
    <div class="error-number">{{ code }}</div>
    <div class="eyebrow">SOMETHING GOT IN THE WAY</div>
    <h1>Let's get you back on track.</h1>
    <p>{{ message }}</p>
    <div class="error-actions"><a class="button button-primary"
            href="{% if current_user %}{{ url_for('dashboard') }}{% else %}{{ url_for('index') }}{% endif %}">Return to
            Vaultly <span>↗</span></a><a class="button button-outline" href="{{ url_for('index') }}">Go to home</a>
    </div>
</section>
{% endblock %}
